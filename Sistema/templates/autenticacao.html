<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tela de Login</title>
  <style>
    :root {
      --bg: #0f172a;            /* slate-900 */
      --card: #0b1222cc;        /* glassy */
      --muted: #94a3b8;         /* slate-400 */
      --text: #e5e7eb;          /* gray-200 */
      --primary: #4f46e5;       /* indigo-600 */
      --primary-2: #6366f1;     /* indigo-500 */
      --ring: #a5b4fc;          /* indigo-300 */
      --danger: #ef4444;        /* red-500 */
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;         /* slate-100 */
        --card: #ffffffee;     /* white */
        --muted: #475569;      /* slate-600 */
        --text: #0f172a;       /* slate-900 */
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(60vmax 60vmax at 10% 20%, #1e293b 0%, transparent 60%),
        radial-gradient(50vmax 50vmax at 90% 10%, #1d4ed8 0%, transparent 60%),
        radial-gradient(40vmax 40vmax at 80% 90%, #0ea5e9 0%, transparent 55%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      animation: rise .6s ease both;
    }

    @keyframes rise { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: grid; place-items: center; font-weight: 800; color: white;
    }
    .brand h1 { font-size: 1.125rem; margin: 0; letter-spacing: .2px; }
    .muted { color: var(--muted); font-size: .95rem; }

    form { margin-top: 8px; display: grid; gap: 14px; }

    .field { display: grid; gap: 6px; }
    .label { font-size: .9rem; color: var(--muted); }

    .control {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, .35);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 10px 12px;
    }

    input[type="email"], input[type="password"] {
      appearance: none;
      outline: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      padding: 8px 2px;
      width: 100%;
    }

    input::placeholder { color: color-mix(in oklab, var(--muted) 80%, transparent); }

    .control:focus-within {
      border-color: var(--ring);
      box-shadow: 0 0 0 4px color-mix(in oklab, var(--ring) 30%, transparent);
    }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

    .checkbox {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--muted);
      font-size: .9rem;
    }
    .checkbox input { width: 16px; height: 16px; }

    .link { color: var(--primary-2); text-decoration: none; font-size: .9rem; }
    .link:hover { text-decoration: underline; }

    .btn {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .06s ease, filter .2s ease;
    }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

    .or {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; color: var(--muted); font-size: .9rem;
    }
    .or::before, .or::after { content: ""; height: 1px; background: rgba(148,163,184,.25); }

    .providers { display: grid; gap: 10px; }
    .provider {
      display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
      background: rgba(15, 23, 42, .2);
      border: 1px dashed rgba(148,163,184,.35);
      border-radius: 12px; padding: 10px 12px; color: var(--text);
      text-decoration: none;
    }

    .footer { margin-top: 12px; text-align: center; color: var(--muted); font-size: .9rem; }

    /* Acessibilidade */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* Layout menor */
    @media (max-width: 380px) {
      .login-card { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="login-card" role="main">
    <div class="brand" aria-hidden="true">
      
      <div>
        <h1>Bem-vindo de volta</h1>
        <p class="muted">Acesse sua conta para continuar</p>
      </div>
    </div>

    <form action="#" method="post" novalidate>
      <div class="field">
        <label for="email" class="label">E-mail</label>
        <div class="control">
          <input id="email" name="email" type="email" inputmode="email" placeholder="voce@exemplo.com" autocomplete="username" required />
        </div>
      </div>

      <div class="field">
        <label for="password" class="label">Senha</label>
        <div class="control">
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required />
        </div>
      </div>

      <div class="row">
        <label class="checkbox"><input type="checkbox" name="remember" /> Manter conectado</label>
        <a class="link" href="#">Esqueci minha senha</a>
      </div>

      <button class="btn" type="submit">Entrar</button>


      <p class="footer">Não tem conta? <a class="link" href="#">Criar conta</a></p>

      <p class="sr-only" aria-live="polite" id="form-help">Campos de e-mail e senha são obrigatórios.</p>
    </form>
  </main>
</body>
</html>
